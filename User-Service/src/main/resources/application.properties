spring.application.name=User-Service
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/userdb}

spring.datasource.username=${DB_USERNAME:userapp}
spring.datasource.password=${DB_PASSWORD:userapp}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.flyway.enabled=true
logging.level.org.flywaydb=debug
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/instagram

s3.endpoint=http://localhost:9000
s3.public-url=http://localhost:9000
s3.access-key=minioadmin
s3.secret-key=minioadmin
s3.region=us-east-1
s3.bucket=avatars
s3.presign-ttl=PT10M